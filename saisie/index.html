<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Participation</title>
<style>
  :root { --fond: #f6f4ef; --carte: #fff; --texte: #1f2328; --doux: #6b6f76; --trait: #e3dfd6; --accent: #b4441c; --accent-t: #fff; --ok: #2f7d4f; --saisi: #fdf1ea; }
  @media (prefers-color-scheme: dark) {
    :root { --fond: #17191c; --carte: #202328; --texte: #eceae6; --doux: #a3a7ad; --trait: #33373d; --accent: #e0703f; --accent-t: #17191c; --ok: #5cbf86; --saisi: #3a2a22; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 16px 120px; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .doux { color: var(--doux); font-size: 14px; }
  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .ligue { display: flex; gap: 8px; align-items: baseline; margin: 2px 0; font-size: 15px; }
  .ligue b { min-width: 24px; }
  .liste { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; overflow: hidden; }
  .ligne { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-bottom: 1px solid var(--trait); }
  .ligne:last-child { border-bottom: 0; }
  .ligne.saisi { background: var(--saisi); }
  .ligne label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input { font: inherit; color: var(--texte); background: var(--fond); border: 1px solid var(--trait); border-radius: 8px; }
  .km { width: 84px; text-align: right; padding: 9px 10px; font-size: 18px; }
  .km:focus, .txt:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .txt { width: 100%; padding: 10px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 20px 4px 8px; }
  details > summary { cursor: pointer; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 20px 4px 8px; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); padding: 10px 14px; }
  button.principal { background: var(--accent); border-color: var(--accent); color: var(--accent-t); font-weight: 600; }
  .ajout { display: flex; gap: 8px; margin-top: 10px; }
  .ajout .txt { flex: 1; }
  .barre { position: fixed; left: 0; right: 0; bottom: 0; background: var(--carte); border-top: 1px solid var(--trait); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .barre-in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
  .barre .total { flex: 1; font-size: 15px; }
  .barre .total b { font-size: 17px; }
  .msg { padding: 10px 12px; border-radius: 10px; background: var(--saisi); margin: 12px 0; font-size: 15px; }
  .erreur { background: #fde2e2; color: #8a1c1c; }
  @media (prefers-color-scheme: dark) { .erreur { background: #4a1f1f; color: #ffc9c9; } }
  .petit { font-size: 14px; padding: 6px 10px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  textarea { width: 100%; min-height: 140px; font: 14px/1.4 ui-monospace, monospace; padding: 8px; border-radius: 8px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); }
</style>
</head>
<body>
<main id="app"><p class="doux">Chargement…</p></main>
<div class="barre" id="barre" hidden><div class="barre-in">
  <div class="total" id="total"></div>
  <button id="b-copier" class="petit" type="button">Copier</button>
  <button id="b-envoyer" class="principal" type="button">Envoyer par mail</button>
</div></div>
<script>
"use strict";
/* Page de saisie de la participation (Sorties Club). La sortie, les noms et les adresses arrivent chiffrés dans le
   lien, après « # » (cette partie ne quitte pas le téléphone). Chiffrement avec le code du club : PBKDF2-SHA256
   150 000 tours -> clé de flot + clé d'authentification, flot HMAC-SHA256 en mode compteur.
   La saisie part par mail (boîte du secrétariat, saisisseurs en copie) avec un lien « Compléter ou corriger »
   qui contient la saisie, chiffrée de la même façon. */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const enc = new TextEncoder();
const lire = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const ecrire = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
let D = null, ETAT = { km: {}, nouveaux: [] };

function b64(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "=";
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
}
async function hmac(cle, donnees) { return new Uint8Array(await crypto.subtle.sign("HMAC", cle, donnees)); }
async function dechiffrer(code, jeton) {
  if (!jeton.startsWith("v1.")) throw new Error("lien");
  const b = b64(jeton.slice(3)), sel = b.slice(0, 16), nonce = b.slice(16, 28), tag = b.slice(28, 44), ch = b.slice(44);
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sel, iterations: 150000, hash: "SHA-256" }, base, 512));
  const imp = k => crypto.subtle.importKey("raw", k, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const kc = await imp(bits.slice(0, 32)), km = await imp(bits.slice(32));
  const t = (await hmac(km, new Uint8Array([...sel, ...nonce, ...ch]))).slice(0, 16);
  if (t.some((x, i) => x !== tag[i])) throw new Error("code");
  const clair = new Uint8Array(ch.length);
  for (let i = 0, bloc = 0; i < ch.length; bloc++) {
    const ctr = new Uint8Array([...nonce, bloc >>> 24 & 255, bloc >>> 16 & 255, bloc >>> 8 & 255, bloc & 255]);
    const f = await hmac(kc, ctr);
    for (let j = 0; j < 32 && i < ch.length; j++, i++) clair[i] = ch[i] ^ f[j];
  }
  return JSON.parse(new TextDecoder().decode(clair));
}

function b64url(u) { let s = ""; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
async function chiffrer(code, donnees) {
  const clair = enc.encode(JSON.stringify(donnees)), sel = crypto.getRandomValues(new Uint8Array(16)), nonce = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: sel, iterations: 150000, hash: "SHA-256" }, base, 512));
  const imp = k => crypto.subtle.importKey("raw", k, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const kc = await imp(bits.slice(0, 32)), km = await imp(bits.slice(32));
  const ch = new Uint8Array(clair.length);
  for (let i = 0, bloc = 0; i < clair.length; bloc++) {
    const f = await hmac(kc, new Uint8Array([...nonce, bloc >>> 24 & 255, bloc >>> 16 & 255, bloc >>> 8 & 255, bloc & 255]));
    for (let j = 0; j < 32 && i < clair.length; j++, i++) ch[i] = clair[i] ^ f[j];
  }
  const tag = (await hmac(km, new Uint8Array([...sel, ...nonce, ...ch]))).slice(0, 16);
  return "v1." + b64url(new Uint8Array([...sel, ...nonce, ...tag, ...ch]));
}

const jeton = location.hash.slice(1);
let CODE = null;
const dateFr = d => d.split("-").reverse().join("/");
const dateLongue = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const nbFr = v => Number(v).toLocaleString("fr-FR", { maximumFractionDigits: 1 });
const val = s => { const v = parseFloat(String(s || "").replace(",", ".")); return isFinite(v) && v > 0 ? Math.round(v * 10) / 10 : 0; };

async function demarrer() {
  if (!jeton) { $("#app").innerHTML = '<h1>Participation</h1><p class="msg">Ouvrez cette page depuis le lien « Participation » de la page de la sortie.</p>'; return; }
  const code = lire("code-club");
  if (code) { try { D = await dechiffrer(code, jeton); CODE = code; } catch (e) { if (e.message === "lien") return lienAbime(); } }
  if (D) afficher(); else demanderCode();
}
function lienAbime() { $("#app").innerHTML = '<h1>Participation</h1><p class="msg erreur">Ce lien est incomplet. Rouvrez-le depuis la page de la sortie.</p>'; }

function demanderCode(erreur) {
  $("#app").innerHTML = `<h1>Participation</h1>
    <p class="doux">Saisie réservée aux saisisseurs désignés.</p>
    ${erreur ? `<p class="msg erreur">${esc(erreur)}</p>` : ""}
    <form id="f-code" class="carte"><label for="code">Code du club</label>
      <input id="code" class="txt" type="password" autocomplete="current-password" autocapitalize="none" style="margin:8px 0 12px">
      <button class="principal" style="width:100%">Ouvrir la saisie</button></form>`;
  $("#code").focus();
  $("#f-code").onsubmit = async e => {
    e.preventDefault();
    const c = $("#code").value.trim(); if (!c) return;
    e.submitter && (e.submitter.textContent = "Vérification…");
    try { D = await dechiffrer(c, jeton); CODE = c; ecrire("code-club", c); afficher(); }
    catch (x) { demanderCode(x.message === "lien" ? "Ce lien est incomplet." : "Code incorrect."); }
  };
}

function cle() { return "saisie-" + D.d; }
function charger() {
  let brouillon = null; try { brouillon = JSON.parse(lire(cle())); } catch (e) {}
  /* lien « compléter ou corriger » : il porte la dernière saisie envoyée ; il l'emporte sur un brouillon plus ancien */
  if (D.p && (!brouillon || (brouillon.base || "") < D.ts)) {
    const connus = new Set([...D.a, ...D.i]);
    ETAT = { km: {}, nouveaux: [], base: D.ts, recu: true, envoyes: Object.keys(D.p) };
    for (const [n, k] of Object.entries(D.p)) { if (connus.has(n)) ETAT.km[n] = String(k).replace(".", ","); else ETAT.nouveaux.push({ nom: n, km: String(k).replace(".", ",") }); }
    garder();
  } else if (brouillon) ETAT = brouillon;
  ETAT.km = ETAT.km || {}; ETAT.nouveaux = ETAT.nouveaux || []; ETAT.envoyes = ETAT.envoyes || [];
}
function garder() { ecrire(cle(), JSON.stringify(ETAT)); }

function ligne(nom, k) {
  const v = ETAT.km[nom] || "";
  if (!val(v) && ETAT.envoyes.includes(nom)) return `<div class="ligne"><label for="k${k}">${esc(nom)} <span class="doux">sera retiré</span></label>
    <input id="k${k}" class="km" data-nom="${esc(nom)}" inputmode="decimal" autocomplete="off" value="${esc(v)}" placeholder="km"></div>`;
  return `<div class="ligne ${val(v) ? "saisi" : ""}"><label for="k${k}">${esc(nom)}</label>
    <input id="k${k}" class="km" data-nom="${esc(nom)}" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(v)}" placeholder="km"></div>`;
}

function afficher() {
  charger();
  document.title = "Participation " + dateFr(D.d);
  const lig = (x, n) => x ? `<div class="ligue"><b>${n}</b><span>${esc(x[0])}${x[1] ? ` · <b>${x[1]} km</b>` : ""}</span></div>` : "";
  let k = 0;
  $("#app").innerHTML = `<div class="doux">Participation</div><h1>${esc(dateLongue(D.d))}</h1>
    ${ETAT.recu ? `<p class="msg">Saisie déjà envoyée${D.ts ? ` (${esc(D.ts.slice(8, 10) + "/" + D.ts.slice(5, 7) + " à " + D.ts.slice(11, 16))})` : ""} : complétez ou corrigez, puis renvoyez. Le nouvel envoi remplace le précédent.</p>` : ""}
    ${D.l1 || D.l2 ? `<div class="carte">${lig(D.l1, "L1")}${lig(D.l2, "L2")}<div class="doux" style="margin-top:4px">Saisissez les km réellement parcourus par chacun.</div></div>` : ""}
    <h2>Adhérents (${D.a.length})</h2>
    <div class="liste">${D.a.map(n => ligne(n, k++)).join("")}</div>
    <details id="d-inv" ${D.i.some(n => val(ETAT.km[n])) || ETAT.nouveaux.length ? "open" : ""}><summary>Invités (${D.i.length + ETAT.nouveaux.length})</summary>
      <div class="liste">${D.i.map(n => ligne(n, k++)).join("")}${ETAT.nouveaux.map((x, j) => `<div class="ligne saisi"><label>${esc(x.nom)} <span class="doux">nouveau</span></label>
        <input class="km" data-nouveau="${j}" inputmode="decimal" value="${esc(x.km)}" placeholder="km"></div>`).join("")}</div>
      <div class="ajout"><input id="n-nom" class="txt" placeholder="Nouvel invité : nom" autocomplete="off"><button id="b-ajout" type="button">Ajouter</button></div>
    </details>
    <div class="actions"><button id="b-effacer" class="petit" type="button">Effacer la saisie</button></div>
    <div id="secours"></div>`;
  $("#barre").hidden = false;
  document.querySelectorAll("[data-nom]").forEach(i => i.oninput = () => {
    ETAT.km[i.dataset.nom] = i.value; i.closest(".ligne").classList.toggle("saisi", !!val(i.value)); garder(); total(); });
  document.querySelectorAll("[data-nouveau]").forEach(i => i.oninput = () => { ETAT.nouveaux[+i.dataset.nouveau].km = i.value; garder(); total(); });
  const champs = [...document.querySelectorAll(".km")];
  champs.forEach((c, j) => c.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); (champs[j + 1] || c).focus(); } });
  $("#b-ajout").onclick = () => {
    const nom = $("#n-nom").value.trim().replace(/\s+/g, " "); if (!nom) return;
    ETAT.nouveaux.push({ nom, km: "" }); garder(); afficher();
    const n = document.querySelector(`[data-nouveau="${ETAT.nouveaux.length - 1}"]`); n && n.focus();
  };
  $("#b-effacer").onclick = () => { if (confirm("Effacer toute la saisie de cette sortie sur ce téléphone ?")) { ETAT = { km: {}, nouveaux: [] }; ecrire(cle(), null); afficher(); } };
  total();
}

function participants() {
  const l = [...D.a, ...D.i].filter(n => val(ETAT.km[n])).map(n => [n, val(ETAT.km[n]), false]);
  ETAT.nouveaux.filter(x => val(x.km)).forEach(x => l.push([x.nom, val(x.km), true]));
  return l;
}
/* personnes déjà envoyées (dernier mail reçu ou envoyé) dont la case a été vidée : retrait demandé par « 0 » */
function retraits() { const ici = new Set(participants().map(x => x[0])); return ETAT.envoyes.filter(n => !ici.has(n)); }
function total() {
  const l = participants(), km = l.reduce((a, x) => a + x[1], 0);
  $("#total").innerHTML = `<b>${l.length}</b> participant${l.length > 1 ? "s" : ""} · <b>${nbFr(Math.round(km))}</b> km`;
}
function corps(lienSuite) {
  const l = participants(), km = l.reduce((a, x) => a + x[1], 0);
  const noms = l.map(([n, , nouv]) => (nouv ? "+ " : "") + n), w = Math.max(18, ...noms.map(n => n.length)) + 3;
  const fk = k => String(k).replace(".", ",").padStart(5);
  const lig = (x, n) => x ? `${n}  ${x[0]}${x[1] ? `  –  ${x[1]} km` : ""}` : null;
  return [`Participation ${dateFr(D.d)}`, lig(D.l1, "L1"), lig(D.l2, "L2"), "",
    ...l.map(([, k, nouv], j) => `${noms[j]} ${".".repeat(w - noms[j].length)} ${fk(k)}${nouv ? "   (nouvel invité)" : ""}`),
    ...retraits().map(n => `${n} ${".".repeat(Math.max(3, w - n.length))} ${fk(0)}   (retiré)`),
    "-".repeat(w + 7),
    `${l.length} participant${l.length > 1 ? "s" : ""}`.padEnd(w + 1) + " " + String(Math.round(km)).padStart(5) + " km",
    "", ...(lienSuite ? ["Compléter ou corriger cette saisie (réservé aux saisisseurs) :", lienSuite] : [])].filter(x => x !== null).join("\n");
}
async function preparer() {
  const p = {}; participants().forEach(([n, k]) => p[n] = k);
  const ts = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
  const suite = `${location.origin}${location.pathname}#${await chiffrer(CODE, { ...D, p, ts })}`;
  ETAT.base = ts;
  const texte = corps(suite);
  ETAT.envoyes = participants().map(x => x[0]); garder();
  const l = participants(), km = Math.round(l.reduce((a, x) => a + x[1], 0));
  return { objet: `Participation ${dateFr(D.d)} – ${l.length} participant${l.length > 1 ? "s" : ""}, ${nbFr(km)} km`, texte };
}
$("#b-envoyer").onclick = async () => {
  if (!participants().length) { alert("Aucun km saisi."); return; }
  $("#b-envoyer").textContent = "Préparation…";
  const m = await preparer();
  $("#b-envoyer").textContent = "Envoyer par mail";
  const cc = (D.m.cc || []).join(",");
  location.href = `mailto:${D.m.a}?${cc ? `cc=${encodeURIComponent(cc)}&` : ""}subject=${encodeURIComponent(m.objet)}&body=${encodeURIComponent(m.texte)}`;
  $("#secours").innerHTML = `<p class="msg">Si votre messagerie ne s'est pas ouverte, utilisez « Copier » et envoyez le texte à ${esc(D.m.a)}${cc ? ` (copie : ${esc(cc)})` : ""}, avec pour objet « ${esc(m.objet)} ».</p>`;
};
$("#b-copier").onclick = async () => {
  const m = await preparer();
  try { await navigator.clipboard.writeText(m.texte); $("#secours").innerHTML = `<p class="msg">Texte copié : collez-le dans un mail à ${esc(D.m.a)}, objet « ${esc(m.objet)} ».</p>`; }
  catch (e) { $("#secours").innerHTML = `<p class="msg">Sélectionnez et copiez le texte, à envoyer à ${esc(D.m.a)} :</p><textarea readonly>${esc(m.texte)}</textarea>`; }
};
window.addEventListener("hashchange", () => location.reload());
demarrer();
</script>
</body>
</html>
